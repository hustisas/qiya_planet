<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>启芽星球 · PC Web 原型</title>
<style>
  :root {
    --ink:#1c2b3a; --muted:#5d6b7a; --line:#e4e8ee; --paper:#f4f6f8;
    --card:#fff; --sea:#0f6e78; --leaf:#2f8f5b; --persimmon:#e25b32;
    --cream:#fff7ee; --admin:#001529; --admin2:#001f3a; --blue:#1677ff;
    --warn:#a15c07; --bad:#b42318; --ok:#067647;
  }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; }
  body { font-family:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; color:var(--ink); background:var(--paper); }
  button, input, select, textarea { font:inherit; color:inherit; }
  button { cursor:pointer; }
  button:disabled { cursor:not-allowed; opacity:.45; }
  .chrome { position:sticky; top:0; z-index:30; display:flex; gap:10px; align-items:center; flex-wrap:wrap; padding:10px 16px; background:#102033; color:#fff; }
  .chrome b { font-size:14px; font-weight:650; letter-spacing:.02em; }
  .chrome .switch { display:flex; gap:6px; }
  .chrome .switch button, .grades button { border:0; border-radius:999px; padding:6px 12px; background:#24384f; color:#fff; }
  .chrome .switch button.is-on { background:var(--persimmon); }
  .grades { display:flex; gap:6px; align-items:center; margin-left:auto; }
  .grades span { font-size:12px; opacity:.75; }
  .grades button.is-on { background:#f3d2b4; color:#3b2416; }
  .hint { width:100%; font-size:12px; opacity:.75; }
  .toast { position:fixed; left:50%; bottom:22px; transform:translateX(-50%); background:#102033; color:#fff; padding:10px 14px; border-radius:999px; z-index:50; font-size:13px; max-width:min(560px,92vw); }

  .pc { min-height:calc(100vh - 74px); display:grid; grid-template-rows:64px 1fr; background:linear-gradient(180deg,#e7f4f2 0%, #f7f1e8 40%, #f4f6f8 100%); }
  .top { display:flex; align-items:center; gap:14px; padding:0 18px; background:rgba(255,255,255,.9); border-bottom:1px solid var(--line); }
  .brand { font-weight:750; color:var(--sea); }
  .brand i { font-style:normal; display:inline-grid; place-items:center; width:28px; height:28px; margin-right:8px; border-radius:9px; background:#e7f6ef; }
  .who { display:flex; align-items:center; gap:8px; }
  .badge { border-radius:999px; background:#eef2f4; padding:3px 8px; font-size:12px; color:#3e5163; }
  .spacer { margin-left:auto; display:flex; gap:8px; align-items:center; }
  .avatar { width:36px; height:36px; border:0; border-radius:50%; background:#dff3ea; }
  .layout { display:grid; grid-template-columns:196px minmax(0,1fr) 260px; min-height:0; }
  .nav, .rail { padding:14px; }
  .nav { display:flex; flex-direction:column; gap:6px; }
  .nav button, .rowbtn, .ghost, .go, .big, .mini { border:0; border-radius:12px; }
  .nav button { text-align:left; padding:10px 12px; background:transparent; color:#24404a; }
  .nav button.is-on { background:#fff; color:var(--sea); box-shadow:0 1px 0 rgba(16,32,51,.04); }
  .remain { display:flex; flex-direction:column; gap:4px; margin:0 0 8px 8px; }
  .remain span { font-size:11px; color:#607080; padding-left:4px; }
  .remain button { font-size:12px !important; padding:6px 10px !important; }
  .is-pre .nav button { padding:16px 14px; font-size:18px; border-radius:16px; background:#fff; }
  .is-mid .nav button { border-radius:6px; }
  .is-mid .brand i, .is-mid .avatar { border-radius:4px; }
  .main { padding:16px 8px 24px 0; min-width:0; }
  .rail { padding-left:0; }
  .panel { background:var(--card); border-radius:18px; padding:16px; box-shadow:0 10px 30px rgba(28,43,58,.05); }
  .kicker { margin:0 0 4px; font-size:12px; letter-spacing:.08em; color:var(--sea); }
  h2, h3, p { margin-top:0; }
  h2 { margin-bottom:6px; font-size:26px; }
  .muted { color:var(--muted); font-size:13px; }
  .grid4, .grid3, .grid2 { display:grid; gap:10px; }
  .grid4 { grid-template-columns:repeat(4,minmax(0,1fr)); }
  .grid3 { grid-template-columns:repeat(3,minmax(0,1fr)); }
  .grid2 { grid-template-columns:repeat(2,minmax(0,1fr)); }
  .card, .item, .opt { border:1px solid var(--line); background:#fff; border-radius:16px; text-align:left; }
  .card { padding:14px; }
  .card b, .item b { display:block; }
  .card .tiny, .tiny { color:var(--muted); font-size:12px; }
  .hero { display:flex; justify-content:space-between; gap:16px; align-items:end; margin-bottom:12px; }
  .go, .big { background:var(--persimmon); color:#fff; padding:12px 16px; }
  .ghost { background:#f3f5f7; padding:10px 12px; }
  .mini { background:#e7f6ef; color:#135c3a; padding:6px 10px; }
  .rail .panel { position:sticky; top:86px; background:#17343a; color:#f4fffb; }
  .rail .go { width:100%; margin-top:10px; }
  .rail .tiny { color:#c9ddd8; }
  .steps { display:flex; gap:6px; margin-bottom:12px; }
  .steps span { flex:1; text-align:center; font-size:12px; padding:6px 4px; border-radius:999px; background:#eef2f4; color:#607080; }
  .steps span.is-on { background:#17343a; color:#fff; }
  .finder { height:280px; border-radius:18px; background:radial-gradient(circle at 50% 40%, #fff, #d7ece4 42%, #9ec9c2); display:grid; place-items:center; position:relative; overflow:hidden; }
  .finder img { max-width:100%; max-height:100%; object-fit:contain; }
  .shot { font-size:72px; }
  .opts { display:grid; gap:8px; }
  .opt { padding:12px 14px; }
  .opt.is-pick { border-color:var(--sea); background:#f1fbf8; }
  .opt.bad { border-color:#f0b4ae; background:#fff5f4; }
  .opt.ok { border-color:#b7e4c7; background:#f3fbf6; }
  .pad { display:grid; grid-template-columns:repeat(3,72px); gap:8px; }
  .pad button { height:56px; border:0; border-radius:14px; background:#fff; box-shadow:inset 0 0 0 1px var(--line); font-size:20px; }
  .sum { font-size:64px; letter-spacing:.04em; margin:8px 0; }
  .lcd { min-height:48px; font-size:32px; }
  .poem-line { display:block; width:100%; border:0; background:transparent; text-align:center; font-size:28px; padding:6px; border-radius:10px; }
  .poem-line.is-on { background:#fff3df; }
  .poet { display:flex; gap:12px; align-items:center; margin-top:12px; padding:12px; border-radius:16px; background:#fff8ee; }
  .poet .face { width:64px; height:64px; border-radius:50%; display:grid; place-items:center; background:#f3d7b0; font-size:28px; }
  .poet.is-talk .face { animation:bob .6s ease; }
  @keyframes bob { 50% { transform:translateY(-8px) rotate(-4deg); } }
  .tabs { display:flex; gap:6px; margin-bottom:10px; }
  .tabs button { border:0; border-radius:999px; padding:6px 10px; background:#eef2f4; }
  .tabs button.is-on { background:#17343a; color:#fff; }
  .list { display:flex; flex-direction:column; gap:8px; }
  .item { padding:12px; display:flex; justify-content:space-between; gap:8px; align-items:center; }
  .is-pre .sum, .is-pre h2 { font-size:34px; }
  .is-pre .card { padding:18px; }
  .is-mid .pc, .is-mid.pc { background:#f5f6f8; }
  .is-mid .hero, .is-mid .card { border-radius:8px; }
  .plain { list-style:none; padding:0; margin:0; display:flex; flex-direction:column; gap:8px; }
  .plain button { width:100%; text-align:left; border:1px solid var(--line); background:#fff; border-radius:10px; padding:12px; }
  .bar { height:8px; border-radius:99px; background:#e5eeeb; overflow:hidden; }
  .bar i { display:block; height:100%; background:var(--leaf); width:0; }
  .split { display:grid; grid-template-columns:1.2fr .8fr; gap:12px; }
  .reason { background:#fff6e8; border-radius:12px; padding:10px 12px; color:#6a4b16; }

  .admin { min-height:calc(100vh - 74px); display:grid; grid-template-columns:248px 1fr; background:#f0f2f5; color:rgba(0,0,0,.88); }
  .sider { background:var(--admin); color:rgba(255,255,255,.85); overflow:auto; max-height:calc(100vh - 74px); padding-bottom:24px; }
  .sider .logo { padding:16px 16px 8px; color:#fff; font-weight:700; }
  .sider .logo small { display:block; font-weight:400; opacity:.6; font-size:12px; }
  .group-label { margin:14px 16px 6px; font-size:11px; letter-spacing:.08em; color:rgba(255,255,255,.45); }
  .sider button.menu { width:100%; text-align:left; border:0; background:transparent; color:inherit; padding:8px 16px; }
  .sider button.menu.is-on { background:var(--blue); color:#fff; }
  .sider button.sub { width:100%; text-align:left; border:0; background:transparent; color:rgba(255,255,255,.75); padding:7px 16px 7px 32px; }
  .sider button.sub.is-on { color:#fff; background:#0b2a4a; }
  .work { min-width:0; }
  .ahead { height:48px; display:flex; align-items:center; gap:8px; padding:0 16px; background:#fff; border-bottom:1px solid #f0f0f0; }
  .crumb { color:#8c8c8c; font-size:13px; }
  .content { padding:16px; }
  .keep, .fresh { display:inline-block; border-radius:4px; padding:0 6px; font-size:12px; margin-right:6px; }
  .keep { background:#f5f5f5; color:#595959; }
  .fresh { background:#f6ffed; color:#237804; }
  table { width:100%; border-collapse:collapse; background:#fff; }
  th, td { text-align:left; padding:10px 12px; border-bottom:1px solid #f0f0f0; font-size:13px; }
  th { background:#fafafa; color:#595959; font-weight:600; }
  tr.click:hover td { background:#f5faff; }
  .toolbar { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px; }
  .toolbar input, .toolbar select, .field input, .field select, .field textarea { border:1px solid #d9d9d9; border-radius:6px; padding:6px 8px; background:#fff; }
  .primary { border:0; border-radius:6px; background:var(--blue); color:#fff; padding:6px 12px; }
  .linebtn { border:1px solid #d9d9d9; background:#fff; border-radius:6px; padding:6px 10px; }
  .stats { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:12px; margin-bottom:12px; }
  .stat { background:#fff; border-radius:8px; padding:14px; }
  .stat b { font-size:24px; display:block; }
  .drawer-back { position:fixed; inset:74px 0 0 248px; background:rgba(0,0,0,.28); display:flex; justify-content:flex-end; z-index:40; }
  .drawer { width:min(420px,100%); background:#fff; padding:18px; overflow:auto; box-shadow:-8px 0 24px rgba(0,0,0,.08); }
  .tag { border-radius:4px; padding:1px 6px; font-size:12px; background:#f0f0f0; }
  .tag.ok { background:#f6ffed; color:var(--ok); }
  .tag.wait { background:#fff7e6; color:var(--warn); }
  .tag.bad { background:#fff2f0; color:var(--bad); }
  .note { background:#fff; border-radius:8px; padding:12px 14px; margin-bottom:12px; font-size:13px; }
  .parent { min-height:calc(100vh - 74px); display:grid; grid-template-columns:220px 1fr; background:#f6f7f9; }
  .pnav { background:#fff; border-right:1px solid var(--line); padding:16px 10px; }
  .pnav button { display:block; width:100%; text-align:left; border:0; background:transparent; border-radius:10px; padding:10px 12px; }
  .pnav button.is-on { background:#eef6f4; color:var(--sea); }
  .pmain { padding:18px; }
  .childpick { display:flex; gap:8px; margin-bottom:12px; }
  .childpick button { border:1px solid var(--line); background:#fff; border-radius:12px; padding:8px 10px; }
  .childpick button.is-on { border-color:var(--sea); }
  .meter { height:10px; border-radius:99px; background:#e8edf1; overflow:hidden; }
  .meter i { display:block; height:100%; background:var(--sea); }
  @media (max-width:1100px) {
    .layout { grid-template-columns:180px 1fr; }
    .rail { grid-column:1 / -1; padding:0 14px 16px; }
    .rail .panel { position:static; }
    .grid4 { grid-template-columns:1fr 1fr; }
    .stats { grid-template-columns:1fr 1fr; }
    .split { grid-template-columns:1fr; }
  }
  @media (max-width:800px) {
    .layout, .admin, .parent { grid-template-columns:1fr; }
    .nav { flex-direction:row; overflow:auto; }
    .sider { max-height:none; }
    .drawer-back { inset:0; }
    .grades { margin-left:0; }
  }
</style>
</head>

const state = {

let timers = [];
function clearTimers() { timers.forEach((id) => { clearTimeout(id); clearInterval(id); }); timers = []; }
function later(fn, ms) { const id = setTimeout(fn, ms); timers.push(id); }
function toast(msg) {
  state.toast = msg;
  render();
  later(() => { state.toast = ""; const node = document.querySelector(".toast"); if (node) node.remove(); }, 1800);
}
function grade() { return GRADES[state.grade]; }
function hookOf(word) {
  const row = state.mnemonics.find((m) => m.word === word && m.status === "通过");
  return row ? row.text : "";
}
function esc(s) { return String(s).replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c])); }

function memberAdminPage() {

    <div class="stats"><div class="stat"><span>今日主按钮</span><b>好吃的第 3 关</b></div><div class="stat"><span>节气诗词</span><b>${esc(state.festival)}</b></div><div class="stat"><span>活动皮肤</span><b>${esc(state.skin)}</b></div><div class="stat"><span>学生端广告</span><b>没有</b></div></div>
    <table><thead><tr><th>位置</th><th>现在显示</th><th>给谁看</th></tr></thead><tbody>
      <tr class="click" data-row="学生今日 / 继续今天 / 好吃的第 3 关"><td>学生今日</td><td>继续今天 · 好吃的第 3 关</td><td>学生</td></tr>
      <tr class="click" data-row="节气诗词 / ${state.festival} / 诗词目录置顶，不替换正在读的诗"><td>诗词目录</td><td>${esc(state.festival)}置顶，不打断正在读的诗</td><td>学生</td></tr>

    </tbody></table>

    <p class="tiny">会员未开放时，这里不能放价格和开通按钮。</p>`;
}
const QIYA_PAGES = { workbench, family: familyPage, learn: learnPage, review: reviewPage, words: wordsPage, levels: levelsPage, listenadmin: listenAdminPage, mnemonic: reviewPage, poems: poemsPage, poets: poetsPage, knowledge: knowledgePage, subjects: subjectsPage, memberadmin: memberAdminPage, resetboard: resetPage, growth: growthPage, recommend: recommendPage };
const TITLES = { workbench: "启芽工作台", family: "学生与家庭", learn: "学习数据", review: "AI 审核", words: "英语 / 词库", levels: "英语 / 闯关世界", listenadmin: "英语 / 磨耳朵", mnemonic: "英语 / 助记审核", poems: "语文 / 诗词库", poets: "语文 / 诗人馆", knowledge: "数学 / 知识点", subjects: "科目与年级", memberadmin: "家庭会员", resetboard: "重置与付费", growth: "推广看板", recommend: "今日与节气" };
function renderAdmin() {
  const qiya = Boolean(QIYA_PAGES[state.adminPage]);
  const title = qiya ? TITLES[state.adminPage] : (TABLES[state.adminPage] ? TABLES[state.adminPage][0] : "页面");
  const body = qiya ? QIYA_PAGES[state.adminPage]() : legacyPage();
  const drawer = state.drawer ? `<div class="drawer-back" data-act="close-drawer"><div class="drawer" data-stop="1"><h3>${esc(state.drawer.title)}</h3><p>${esc(state.drawer.body)}</p><button class="primary" type="button" data-act="close-drawer">关闭</button></div></div>` : "";
  return `<div class="admin"><aside class="sider"><div class="logo">SmartAdmin<small>原有菜单保留</small></div><div class="group-label">框架原有</div>${siderLegacy()}<div class="logo">启芽星球<small>新增，不替换原菜单</small></div>${siderQiya()}</aside><section class="work"><div class="ahead"><span class="crumb">${qiya ? "启芽新增 / " : "框架原有 / "}${title}</span></div><div class="content">${body}</div></section>${drawer}</div>`;
}function siderQiya() {
  let html = `<div class="group-label">第一层 · 先看整体</div>`;
  [["workbench", "启芽工作台"], ["family", "学生与家庭"], ["learn", "学习数据"], ["review", "AI 审核"]].forEach(([id, name]) => { html += menuBtn(id, name, "sub"); });
  html += `<div class="group-label">第二层 · 科目内容</div>`;
  [["en", "英语", [["words", "词库"], ["levels", "闯关世界"], ["listenadmin", "磨耳朵"], ["mnemonic", "助记审核"]]], ["cn", "语文", [["poems", "诗词库"], ["poets", "诗人馆"]]], ["math", "数学", [["knowledge", "知识点"]]]].forEach(([id, name, children]) => {
    html += `<button type="button" class="sub" data-open="${id}">${state.open[id] ? "▾" : "▸"} ${name}</button>`;
    if (state.open[id]) children.forEach(([cid, cname]) => { html += menuBtn(cid, cname, "sub"); });
  });
  html += `<div class="group-label">第三层 · 以后加科目</div>`;
  html += menuBtn("subjects", "科目与年级", "sub");
  html += `<div class="group-label">第四层 · 家长与商业</div>`;
  [["memberadmin", "家庭会员"], ["resetboard", "重置与付费"], ["growth", "推广看板"], ["recommend", "今日与节气"]].forEach(([id, name]) => { html += menuBtn(id, name, "sub"); });
  return html;
}
function render() {
  clearTimers();
  const root = document.getElementById("app");
  const body = state.role === "student" ? renderStudent() : state.role === "parent" ? parentPage() : renderAdmin();
  root.innerHTML = chrome() + body;
  if (state.role === "student" && state.page === "battle" && state.phase === "think") {
    later(() => { state.phase = "choose"; render(); }, state.grade === "pre" ? 400 : 900);
  }
  if (state.role === "student" && state.page === "photo" && state.photo === "look") {
    later(() => { state.photo = "pick"; render(); }, 1100);
  }
  if (state.role === "student" && state.page === "listen" && state.playing) later(tickListen, 250);
}
function tickListen() {
  if (!state.playing || state.page !== "listen") return;
  state.progress = Math.min(100, state.progress + 2);
  const bar = document.querySelector("[data-bar]");
  const lab = document.querySelector("[data-bar-label]");
  if (!bar) { state.playing = false; return; }
  bar.style.width = state.progress + "%";
  if (lab) lab.textContent = state.progress + "% · " + state.speed + (state.showZh ? " · 中文提示开" : "");
  if (state.progress >= 100) state.playing = false;
  else later(tickListen, 250);
}
function goto(page) { state.page = page; if (page === "battle") { state.phase = "think"; state.picked = ""; } render(); }
function onClick(event) {
  const t = event.target.closest("button, tr.click, [data-act]");
  if (!t) return;
  if (t.dataset.stop) { event.stopPropagation(); return; }
  if (t.dataset.role) { state.role = t.dataset.role; state.drawer = null; render(); return; }
  if (t.dataset.grade) { state.grade = t.dataset.grade; render(); return; }
  if (t.dataset.page) { goto(t.dataset.page); return; }
  if (t.dataset.parent) { state.parentPage = t.dataset.parent; render(); return; }
  if (t.dataset.child) { state.child = t.dataset.child; render(); return; }
  if (t.dataset.open) { state.open[t.dataset.open] = !state.open[t.dataset.open]; render(); return; }
  if (t.dataset.admin) { state.adminPage = t.dataset.admin; state.drawer = null; render(); return; }
  if (t.dataset.book) { state.bookTab = t.dataset.book; render(); return; }
  if (t.dataset.word) { state.openWord = t.dataset.word; state.page = "word"; render(); return; }
  if (t.dataset.world) { if (t.dataset.world === "food") goto("battle"); else toast("这个世界还没点亮，先把好吃的闯完。"); return; }
  if (t.dataset.poem) { state.poemId = t.dataset.poem; state.poemLine = -1; state.page = "poem"; render(); return; }
  if (t.dataset.line) { state.poemLine = Number(t.dataset.line); render(); return; }
  if (t.dataset.ptab) { state.poemTab = t.dataset.ptab; render(); return; }
  if (t.dataset.pick) { state.photoPick = Number(t.dataset.pick); render(); return; }
  if (t.dataset.point) { state.point = t.dataset.point; state.page = "math"; state.mathWhy = "已换成「" + state.point + "」。题目仍从小学知识点里出。"; render(); return; }
  if (t.dataset.mathmode) { state.mathMode = t.dataset.mathmode; render(); return; }
  if (t.dataset.key) { onKey(t.dataset.key); return; }
  if (t.dataset.cmp) { state.mathWhy = t.dataset.cmp === ">" ? "对了。8 比 6 大。" : "再看一次，8 比 6 大。"; render(); return; }
  if (t.dataset.answer) { onAnswer(t.dataset.answer); return; }
  if (t.dataset.pass) { setMnemonic(Number(t.dataset.pass), "通过"); return; }
  if (t.dataset.reject) { setMnemonic(Number(t.dataset.reject), "拒绝"); return; }
  if (t.dataset.album) { const a = state.albums[Number(t.dataset.album)]; a.on = !a.on; render(); return; }
  if (t.dataset.material) { const m = state.materials[Number(t.dataset.material)]; m.status = m.status === "通过" ? "待审" : "通过"; render(); return; }
  if (t.dataset.mix) { state.levelMix = t.dataset.mix; render(); return; }
  if (t.dataset.row) { state.drawer = { title: "这一行", body: t.dataset.row + "。原型里点开就是详情，正式开发时这里进编辑或档案。" }; render(); return; }
  const act = t.dataset.act;
  if (act) doAct(act, t);
}
function onAnswer(answer) {
  const word = BATTLE[state.battleIndex];
  state.picked = answer;
  state.phase = "choose";
  if (answer === word.zh) {
    state.stars += 1;
    later(() => nextBattle(), 500);
  } else {
    if (!state.repair.includes(word.en)) state.repair.push(word.en);
    toast(word.en + " 先放进修理袋，这一关结束前还会再出现一次。");
    later(() => nextBattle(), 700);
  }
  render();
}
function nextBattle() {
  if (state.battleIndex >= BATTLE.length - 1) { state.page = "settle"; render(); return; }
  state.battleIndex += 1;
  state.phase = "think";
  state.picked = "";
  render();
}
function onKey(key) {
  if (state.mathMode !== "oral") return;
  if (key === "删除") state.mathInput = state.mathInput.slice(0, -1);
  else if (key === "确定") checkMath();
  else if (state.mathInput.length < 4) state.mathInput += key;
  render();
}
function checkMath() {
  const q = MATHS[state.mathIndex];
  if (state.mathInput === q.ans) {
    state.mathWhy = "对了。下一题已经换上。";
    state.mathIndex = q.next;
    state.mathInput = "";
  } else {
    state.mathWhy = q.why + " 这一题换成更小的数。";
    state.wrongs.unshift({ q: q.show, why: q.why });
    state.mathIndex = q.next;
    state.mathInput = "";
  }
}
function setMnemonic(id, status) {
  const row = state.mnemonics.find((m) => m.id === id);
  if (!row) return;
  row.status = status;
  toast(status === "拒绝" ? "已拒绝。学生端这个词只留图片和例句。" : "已通过。学生端可以看见这句助记。");
}
function doAct(act) {
  if (act === "replay") { state.battleIndex = 0; state.stars = 0; state.repair = []; goto("battle"); return; }
  if (act === "speak") {
    const text = state.grade === "pre" ? "学前只看有没有开口，不打分。" : state.grade === "mid" ? "初中可以看薄弱音，演示不接真实口评。" : "二年级宽松通过，只给星星，不显示百分制。";
    toast(text); return;
  }
  if (act === "demo-shot" || act === "draw") {
    if (state.shotsLeft <= 0) { state.page = "photolimit"; render(); return; }
    state.shotUrl = ""; state.photo = "look"; state.page = "photo"; render(); return;
  }
  if (act === "album") { const input = document.getElementById("file"); if (input) input.click(); return; }
  if (act === "cancel-photo") { state.photo = "cam"; toast("已取消，这次不占次数。"); return; }
  if (act === "again" || act === "back-cam") {
    if (act === "again") state.shotsLeft = Math.max(0, state.shotsLeft - 1);
    state.photo = "cam"; state.page = "photo"; render(); return;
  }
  if (act === "save-photo") {
    state.shotsLeft = Math.max(0, state.shotsLeft - 1);
    const cur = PHOTO_WORDS[state.photoPick];
    if (!state.words.some((w) => w.en === cur.en && w.from === "拍照")) state.words.unshift({ en: cur.en, zh: cur.zh, ph: cur.ph, grade: "1-2 年级", theme: "好吃的", from: "拍照", status: "眼熟" });
    state.photo = "done"; state.bookTab = "photo"; render(); return;
  }
  if (act === "use-up") { state.shotsLeft = 0; state.page = "photolimit"; render(); return; }
  if (act === "gate") {
    const val = (document.getElementById("gate") || {}).value || "";
    state.gateInput = val.trim();
    state.gateOk = state.gateInput === "9" || state.gateInput === "1234";
    if (!state.gateOk) toast("验证没通过。可以请家长重试，学生可以先去闯关。");
    render(); return;
  }
  if (act === "recite") { toast("读完了就好。古诗不走英语发音评分。"); return; }
  if (act === "fix") { state.page = "math"; state.mathWhy = "从错题里抽一道更小的。"; state.mathIndex = 1; state.mathInput = ""; render(); return; }
  if (act === "play") { state.playing = !state.playing; render(); return; }
  if (act === "speed") { state.speed = state.speed === "0.8x" ? "1.0x" : state.speed === "1.0x" ? "1.2x" : "0.8x"; render(); return; }
  if (act === "zh") { state.showZh = !state.showZh; render(); return; }
  if (act === "add-listen") { if (!state.words.some((w) => w.en === "bowl")) state.words.push({ en: "bowl", zh: "碗", ph: "/boʊl/", grade: "1-2 年级", theme: "好吃的", from: "磨耳朵", status: "陌生" }); toast("bowl 已进单词本。"); return; }
  if (act === "toggle-thumb") { state.keepThumb = !state.keepThumb; render(); return; }
  if (act === "toggle-speak") { state.allowSpeak = !state.allowSpeak; render(); return; }
  if (act === "save-grade") { const sel = document.getElementById("newGrade"); state.gradeSaved = "已改成" + (sel ? sel.value : "二年级") + "。旧关卡还在，新题按新年级出。"; render(); return; }
  if (act === "search") { const q = document.getElementById("q"); state.query = q ? q.value : ""; render(); return; }
  if (act === "reset-q") { state.query = ""; render(); return; }
  if (act === "filter-review") { state.subjectFilter = document.getElementById("subf").value; state.statusFilter = document.getElementById("stf").value; render(); return; }
  if (act === "add-word") {
    const en = document.getElementById("newEn").value.trim();
    const zh = document.getElementById("newZh").value.trim();
    if (!en || !zh) { toast("英文和中文都要有，而且必须是词库里的词。"); return; }
    state.words.push({ en, zh, ph: "/", grade: "待标", theme: "未分世界", from: "后台", status: "草稿" });
    toast("已进词库草稿。没审核前学生端不用它出题。"); return;
  }
  if (act === "add-subject") {
    const name = (document.getElementById("subName").value || "科学").trim();
    if (!state.subjects.some((s) => s.name === name)) state.subjects.push({ name, status: "未开放", grades: "未定", entry: "学生端不出现" });
    toast(name + " 已登记为未开放。学生电脑端不会多一个按钮。"); return;
  }
  if (act === "ready-subject") { state.subjectReady = true; toast("内容标记为已齐，现在才可以开放。"); return; }
  if (act === "open-subject") {
    if (!state.subjectReady) { toast("还没有内容，不能开放。"); return; }
    const row = state.subjects.find((s) => s.name === "科学") || state.subjects[state.subjects.length - 1];
    row.status = "已开放"; row.entry = "只出现在地图，不加第五个主按钮";
    toast("已开放。学生导航仍是今日、英语、单词本、诗词、数学、磨耳朵。"); return;
  }
  if (act === "festival") { const list = ["清明", "端午", "中秋", "重阳"]; state.festival = list[(list.indexOf(state.festival) + 1) % list.length]; toast("节气诗词已换成" + state.festival + "。正在读的诗不会被换掉。"); return; }
  if (act === "skin") { state.skin = state.skin === "默认芽绿" ? "节气淡彩" : "默认芽绿"; toast("皮肤已换成" + state.skin + "。左侧导航没变。"); return; }
  if (act === "preview-poet") { const node = document.getElementById("poet-preview"); if (node) node.textContent = "李白点了点头：床前这一句，他看见的是月光，不是霜。"; return; }
  if (act === "close-drawer") { state.drawer = null; render(); }
}
document.addEventListener("click", onClick);
document.addEventListener("change", (event) => {
  if (event.target.id !== "file" || !event.target.files[0]) return;
  const reader = new FileReader();
  reader.onload = () => { state.shotUrl = reader.result; state.photo = "look"; state.page = "photo"; render(); };
  reader.readAsDataURL(event.target.files[0]);
});
render();
</script>
